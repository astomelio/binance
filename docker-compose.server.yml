services:
  # API principal con endpoints de warehouse y actions
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - LAKE_ROOT=/data/lake
      - DBT_DUCKDB_PATH=/data/warehouse/crypto.duckdb
    volumes:
      - .:/app
      - ./data_lake:/data/lake
      - ./artifacts/warehouse:/data/warehouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MLflow UI para experimentos ML
  mlflow:
    image: python:3.10-slim
    ports:
      - "5001:5001"
    volumes:
      - ./artifacts/quant_model:/mlflow
    working_dir: /mlflow
    command: >
      bash -c "pip install mlflow -q && 
               mlflow ui --backend-store-uri sqlite:///mlflow.db --host 0.0.0.0 --port 5001"
    restart: unless-stopped

  # dbt docs con lineage
  dbt-docs:
    image: python:3.10-slim
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - ./artifacts/warehouse:/data/warehouse
    working_dir: /app
    environment:
      - DBT_DUCKDB_PATH=/data/warehouse/crypto.duckdb
    command: >
      bash -c "pip install dbt-duckdb -q &&
               cd data_platform/dbt &&
               dbt docs generate --target local --profiles-dir . &&
               dbt docs serve --port 8080 --host 0.0.0.0 --target local --profiles-dir ."
    restart: unless-stopped

  # Dagster para orquestación (opcional, más pesado)
  dagster-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=dagster
      - POSTGRES_PASSWORD=dagster
      - POSTGRES_DB=dagster
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - full

  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    ports:
      - "3000:3000"
    environment:
      - DAGSTER_HOME=/app/data_platform/orchestration/dagster/dagster_home
      - DAGSTER_PG_HOST=dagster-postgres
      - DAGSTER_PG_DB=dagster
      - DAGSTER_PG_USER=dagster
      - DAGSTER_PG_PASSWORD=dagster
      - API_BASE_URL=http://api:8000
      - LAKE_ROOT=/data/lake
      - DBT_DUCKDB_PATH=/app/artifacts/warehouse/crypto.duckdb
    volumes:
      - .:/app
      - ./data_lake:/data/lake
      - ./artifacts/warehouse:/app/artifacts/warehouse
      - ./artifacts/quant_model:/app/artifacts/quant_model
    depends_on:
      dagster-postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - full

volumes:
  dagster_postgres_data:
