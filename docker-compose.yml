services:
  binance-connector:
    build: .
    ports:
      - "8000:8000"
    environment:
      - BINANCE_API_KEY=${BINANCE_API_KEY}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      - LAKE_ROOT=${LAKE_ROOT_DOCKER:-/data/lake}
    volumes:
      - .:/app
      - ${LAKE_ROOT_HOST:-/Users/joaquincano/data/binance_lake}:${LAKE_ROOT_DOCKER:-/data/lake}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  
  dagster-postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=dagster
      - POSTGRES_PASSWORD=dagster
      - POSTGRES_DB=dagster
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagster -d dagster"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  dagster:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    ports:
      - "3000:3000"
    environment:
      - DAGSTER_HOME=/app/data_platform/orchestration/dagster/dagster_home
      - DAGSTER_PG_HOST=dagster-postgres
      - DAGSTER_PG_DB=dagster
      - DAGSTER_PG_USER=dagster
      - DAGSTER_PG_PASSWORD=dagster
      - API_BASE_URL=http://binance-connector:8000
      - LAKE_ROOT=${LAKE_ROOT_DOCKER:-/data/lake}
    volumes:
      - .:/app
      - ${LAKE_ROOT_HOST:-/Users/joaquincano/data/binance_lake}:${LAKE_ROOT_DOCKER:-/data/lake}
    depends_on:
      dagster-postgres:
        condition: service_healthy
      binance-connector:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dagster_postgres_data:
