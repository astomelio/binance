version: 2

sources:
  - name: raw
    schema: main
    description: "Bronze raw tables loaded from lake (live + historical backfill)"
    freshness:
      warn_after: {count: 2, period: hour}
      error_after: {count: 6, period: hour}
    loaded_at_field: event_time
    tables:
      # High-frequency (hourly): Binance market, derivatives, flow
      - name: market_snapshot_raw
        description: "Spot + futures from Binance (live + historical)"
      - name: derivatives_snapshot_raw
        description: "Futures snapshot (live + historical)"
      - name: derivatives_flow_raw
        description: "Long/short ratio, buy/sell (live + historical)"
      # Cross-exchange + DEX
      - name: cross_exchange_snapshot_raw
        description: "Bybit/OKX prices (live + historical)"
      - name: dex_snapshot_raw
        description: "DEX proxy (live + historical)"
      # Lower-frequency (daily or less)
      - name: global_market_raw
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: fear_greed_raw
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
      - name: macro_rates_raw
        freshness:
          warn_after: {count: 168, period: hour}
          error_after: {count: 336, period: hour}
      - name: macro_assets_raw
        description: "SP500, oil WTI from FRED (daily)"
        freshness:
          warn_after: {count: 48, period: hour}
          error_after: {count: 168, period: hour}
      - name: fed_calendar_raw
        freshness:
          warn_after: {count: 168, period: hour}
          error_after: {count: 336, period: hour}
      - name: stock_prices
      - name: news_sentiment
      - name: x_account_sentiment
      - name: aster_dex_raw
      - name: hyperliquid_raw
      # ML Metadata (synced from SQLite)
      - name: mlflow_runs
      - name: mlflow_metrics
      - name: mlflow_params
      - name: mlflow_tags
      - name: mlflow_experiments
      - name: optuna_studies
      - name: optuna_trials
      - name: optuna_trial_params
      - name: optuna_trial_values

models:
  - name: br_market_snapshot
    columns:
      - name: event_time
        data_tests:
          - not_null
      - name: symbol
        data_tests:
          - not_null
  - name: slv_decision_features
    columns:
      - name: event_time
        data_tests:
          - not_null
      - name: symbol
        data_tests:
          - not_null
  - name: fct_decision_features
    columns:
      - name: feature_id
        data_tests:
          - not_null
          - unique
      - name: symbol
        data_tests:
          - not_null
      - name: event_time
        data_tests:
          - not_null
      - name: alpha_score
        description: "Composite alpha score blending microstructure, momentum, session, liquidity, cross-exchange, and DEX signals"
      - name: fwd_return_1h
        description: "Forward return 1h ahead (label for training)"
      - name: fwd_return_4h
        description: "Forward return 4h ahead (label for training)"
      - name: fwd_return_24h
        description: "Forward return 24h ahead (label for training)"
      - name: regime_combo
        description: "Regime combination (BULL/BEAR/NEUTRAL__HIGH_VOL/LOW_VOL) for policy blocking"

