name: "crypto_trading_lakehouse"
version: "1.0.0"
config-version: 2

profile: "crypto_trading_lakehouse"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  crypto_trading_lakehouse:
    +materialized: table
    bronze:
      +schema: bronze
      +tags: ["bronze"]
    silver:
      +schema: silver
      +tags: ["silver"]
    gold:
      +schema: gold
      +tags: ["gold"]

seeds:
  crypto_trading_lakehouse:
    +schema: crypto_ref

